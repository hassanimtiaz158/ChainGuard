[project]
name = "chainguard-backend"
version = "0.1.0"
description = "ChainGuard API: local-chain attack run engine and static-analysis worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.1",
    "redis>=5.0.0",
    "rq>=1.16.0",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30.0",
    "web3>=7.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "N",   # pep8-naming
    "ANN", # flake8-annotations
    "S",   # bandit
    "ASYNC",
    "RET",
    "SIM",
    "PTH",
    "RUF",
]
ignore = [
    "S101", # assert is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "S105", "S106"]
"alembic/**" = ["ANN", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["redis.*", "yaml.*"]
ignore_missing_imports = true