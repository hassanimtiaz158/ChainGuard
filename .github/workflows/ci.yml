name: CI

# Prompt 1 establishes the job skeleton. Prompts 7 and 14 fill in the real
# steps: forge fmt/build/test/coverage + slither_check.sh, ruff + mypy + pytest,
# and eslint + tsc + vitest + next build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # `contracts/lib` is gitignored (see Makefile: deps), so vendor it here.
      - name: Vendor pinned dependencies
        run: |
          cd contracts
          forge install --no-git --shallow \
            foundry-rs/forge-std@v1.17.0 \
            OpenZeppelin/openzeppelin-contracts@v5.7.0

      - name: Format check
        run: cd contracts && forge fmt --check

      - name: Build
        run: cd contracts && forge build

      - name: Test
        run: cd contracts && forge test -vvv

      - name: Coverage
        run: cd contracts && forge coverage --report summary --report lcov

      - name: Upload lcov report
        uses: actions/upload-artifact@v4
        with:
          name: contracts-lcov
          path: contracts/lcov.info

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Slither gate
        run: |
          pip install slither-analyzer==0.11.6
          scripts/slither_check.sh

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scaffold placeholder
        run: echo "backend job wired in Prompt 8 (ruff + mypy + pytest with testcontainers)."

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scaffold placeholder
        run: echo "frontend job wired in Prompt 11 (eslint + tsc + vitest + next build)."