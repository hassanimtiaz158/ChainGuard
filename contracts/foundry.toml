[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# ChainGuard pins one compiler version across the lab (see specs/AGENT_PROMPTS.md Prompt 0).
solc_version = "0.8.24"

optimizer = true
optimizer_runs = 200
via_ir = false

# Deterministic bytecode keeps `lab.json` addresses reproducible across runs.
bytecode_hash = "none"
cbor_metadata = false

# Only the deploy script may write deployment addresses.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"

# CI runs `forge test -vvv`; keep failures verbose enough to debug from a log.
[profile.ci]
verbosity = 3
fuzz = { runs = 512 }
invariant = { runs = 128, depth = 32 }

[profile.deep.fuzz]
runs = 2000

[profile.deep.invariant]
runs = 512
depth = 64

[profile.lite]
optimizer = false

# No [etherscan] section on purpose: ChainGuard never publishes or verifies
# contracts on a public block explorer. Verification targets the local Anvil
# node only.